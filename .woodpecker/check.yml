when:
  - event: [push, pull_request]

steps:
  - name: install
    image: remotxai-ci:latest
    commands:
      - npm ci --no-audit --no-fund

  - name: ui-rules
    image: remotxai-ci:latest
    depends_on: [install]
    commands:
      - npm run lint:ui

  - name: lint-and-types
    image: remotxai-ci:latest
    depends_on: [install]
    commands:
      - npm run check

  - name: build
    image: remotxai-ci:latest
    depends_on: [install]
    commands:
      - npm run build
